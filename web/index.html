
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پیش‌بینی ریسک آتش‌سوزی استان فارس</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""/>

<style>
  :root{
    --bg:#0f172a;
    --panel:#1e293b;
    --panel2:#273449;
    --text:#e2e8f0;
    --muted:#94a3b8;
    --accent:#f59e0b;
    --danger:#ef4444;
    --ok:#22c55e;
    --border:#334155;
  }

  *{
    box-sizing:border-box;
    margin:0;
    padding:0;
  }

  body{
    font-family:"Vazirmatn","Segoe UI",Tahoma,sans-serif;
    background:var(--bg);
    color:var(--text);
    height:100vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  header{
    background:var(--panel);
    border-bottom:1px solid var(--border);
    padding:12px 20px;
    display:flex;
    align-items:center;
    gap:12px;
    flex-shrink:0;
  }

  header h1{
    font-size:1.05rem;
    font-weight:700;
  }

  header .dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:var(--accent);
  }

  #layout{
    display:flex;
    flex:1;
    min-height:0;
  }

  #sidebar{
    width:330px;
    background:var(--panel);
    border-left:1px solid var(--border);
    padding:16px;
    overflow-y:auto;
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  #map{
    flex:1;
    min-width:0;
    background:#0b1220;
  }

  .card{
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px;
  }

  .card h2{
    font-size:.9rem;
    color:var(--accent);
    margin-bottom:10px;
  }

  .stat-row{
    display:flex;
    justify-content:space-between;
    padding:5px 0;
    font-size:.85rem;
    border-bottom:1px dashed rgba(255,255,255,.07);
  }

  .stat-row:last-child{
    border-bottom:none;
  }

  .stat-row .k{
    color:var(--muted);
  }

  .stat-row .v{
    font-weight:600;
    direction:ltr;
  }

  #status{
    font-size:.85rem;
    padding:10px 12px;
    border-radius:8px;
    line-height:1.7;
  }

  #status.info{
    background:rgba(59,130,246,.15);
    border:1px solid rgba(59,130,246,.4);
    color:#93c5fd;
  }

  #status.ok{
    background:rgba(34,197,94,.12);
    border:1px solid rgba(34,197,94,.4);
    color:#86efac;
  }

  #status.error{
    background:rgba(239,68,68,.12);
    border:1px solid rgba(239,68,68,.45);
    color:#fca5a5;
  }

  #legend-bar{
    display:flex;
    height:14px;
    border-radius:4px;
    overflow:hidden;
    margin:8px 0 4px;
  }

  #legend-bar div{
    flex:1;
  }

  #legend-labels{
    display:flex;
    justify-content:space-between;
    font-size:.7rem;
    color:var(--muted);
    direction:ltr;
  }

  .hidden{
    display:none !important;
  }

  #error-panel{
    border-color:rgba(239,68,68,.5);
  }

  footer{
    font-size:.7rem;
    color:var(--muted);
    text-align:center;
  }

  @media (max-width:760px){
    #layout{
      flex-direction:column;
    }

    #sidebar{
      width:100%;
      max-height:45vh;
      border-left:none;
      border-top:1px solid var(--border);
      order:2;
    }

    #map{
      min-height:50vh;
    }
  }
</style>
</head>

<body>

<header>
  <span class="dot"></span>
  <h1>پیش‌بینی ریسک آتش‌سوزی استان فارس — smart-fars-forecast</h1>
</header>

<div id="layout">

  <div id="map"
       role="application"
       aria-label="نقشه ریسک آتش‌سوزی استان فارس"></div>

  <aside id="sidebar">

    <div id="status" class="info">
      در حال بارگذاری داده‌ها…
    </div>

    <div id="error-panel" class="card hidden">
      <h2>خطا</h2>
      <p id="error-text"
         style="font-size:.85rem; line-height:1.8;"></p>
    </div>

    <div class="card">
      <h2>آمار ریسک آتش‌سوزی</h2>

      <div class="stat-row">
        <span class="k">حداقل</span>
        <span class="v" id="st-min">—</span>
      </div>

      <div class="stat-row">
        <span class="k">حداکثر</span>
        <span class="v" id="st-max">—</span>
      </div>

      <div class="stat-row">
        <span class="k">میانگین</span>
        <span class="v" id="st-mean">—</span>
      </div>

      <div class="stat-row">
        <span class="k">ابعاد شبکه</span>
        <span class="v" id="st-grid">—</span>
      </div>

      <div class="stat-row">
        <span class="k">منبع داده</span>
        <span class="v" id="st-source">—</span>
      </div>

      <div class="stat-row">
        <span class="k">تاریخ داده</span>
        <span class="v" id="st-date">—</span>
      </div>
    </div>

    <div class="card">
      <h2>راهنمای رنگ</h2>

      <div id="legend-bar">
        <div style="background:#fff59d"></div>
        <div style="background:#fdd835"></div>
        <div style="background:#fb8c00"></div>
        <div style="background:#e53935"></div>
        <div style="background:#880e4f"></div>
      </div>

      <div id="legend-labels">
        <span>0</span>
        <span>20</span>
        <span>40</span>
        <span>60</span>
        <span>80</span>
        <span>100</span>
      </div>

      <p style="font-size:.75rem; color:var(--muted); margin-top:6px;">
        ریسک کمتر → ریسک بیشتر
      </p>
    </div>

    <footer>
      ECMWF / GWIS · Leaflet · EPSG:4326
    </footer>

  </aside>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>

<script>
"use strict";

/* --------------------------------------------------
   تنظیمات
-------------------------------------------------- */

var CONFIG = {

  // متادیتای تولیدشده توسط build_forecast.py
  metadataUrl:
    "generated/fire_risk_latest.json",

  // مرز استان فارس
  boundaryUrl:
    "fars.geojson",

  // مسیر واقعی PNG که build_forecast.py تولید می‌کند
  fallbackImageUrl:
    "generated/fire_risk_latest.png",

  // OpenStreetMap
  tileUrl:
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

  tileAttr:
    "&copy; OpenStreetMap contributors",

  // نمای اولیه
  defaultCenter:
    [29.0, 53.5],

  defaultZoom:
    7
};


/* --------------------------------------------------
   عناصر صفحه
-------------------------------------------------- */

var statusEl =
  document.getElementById("status");

var errorPanel =
  document.getElementById("error-panel");

var errorText =
  document.getElementById("error-text");


/* --------------------------------------------------
   وضعیت
-------------------------------------------------- */

function setStatus(msg, kind){

  statusEl.textContent = msg;

  statusEl.className =
    (
      kind === "ok" ||
      kind === "error"
    )
      ? kind
      : "info";
}


function showError(msg){

  errorPanel.classList.remove("hidden");

  errorText.textContent = msg;

  setStatus(
    "خطا در بارگذاری — " + msg,
    "error"
  );
}


function hideError(){

  errorPanel.classList.add(
    "hidden"
  );
}


/* --------------------------------------------------
   آمار
-------------------------------------------------- */

function setStat(id, value){

  var el =
    document.getElementById(id);

  if(el){
    el.textContent = value;
  }
}


/* --------------------------------------------------
   نقشه
-------------------------------------------------- */

var map =
  L.map(
    "map",
    {
      zoomControl:true
    }
  ).setView(
    CONFIG.defaultCenter,
    CONFIG.defaultZoom
  );


L.tileLayer(
  CONFIG.tileUrl,
  {
    attribution:CONFIG.tileAttr,
    maxZoom:19
  }
).addTo(map);


var farsLayer = null;

var riskOverlay = null;


/* --------------------------------------------------
   اعتبارسنجی متادیتا
-------------------------------------------------- */

function validateMetadata(meta){

  if(
    !meta ||
    typeof meta !== "object"
  ){
    throw new Error(
      "فایل فراداده JSON معتبر نیست."
    );
  }


  if(
    !meta.web ||
    typeof meta.web !== "object"
  ){
    throw new Error(
      "بخش web در فراداده یافت نشد."
    );
  }


  var crs =
    String(
      meta.web.crs || ""
    )
    .trim()
    .toUpperCase();


  if(
    crs !== "EPSG:4326"
  ){
    throw new Error(
      "CRS وب باید EPSG:4326 باشد؛ مقدار فعلی: " +
      crs
    );
  }


  var b =
    meta.web.bounds;


  if(
    !Array.isArray(b) ||
    b.length !== 4
  ){
    throw new Error(
      "bounds باید شامل چهار مقدار باشد."
    );
  }


  for(
    var i = 0;
    i < 4;
    i++
  ){

    if(
      typeof b[i] !== "number" ||
      !isFinite(b[i])
    ){
      throw new Error(
        "bounds شامل مقدار نامعتبر است."
      );
    }
  }


  var west =
    b[0];

  var south =
    b[1];

  var east =
    b[2];

  var north =
    b[3];


  if(
    !(west < east) ||
    !(south < north)
  ){
    throw new Error(
      "ترتیب bounds نامعتبر است."
    );
  }


  // کنترل محدوده تقریبی استان فارس

  if(
    west < 49 ||
    east > 59 ||
    south < 25 ||
    north > 33
  ){
    throw new Error(
      "bounds خارج از محدوده مورد انتظار استان فارس است."
    );
  }


  var leafletBounds = [
    [south, west],
    [north, east]
  ];


  /*
     مسیر تصویر:

     اولویت:
       1. meta.web.image_url
       2. meta.image_url
       3. مسیر واقعی generated/fire_risk_latest.png
  */

  var imageUrl =
    meta.web.image_url ||
    meta.image_url ||
    CONFIG.fallbackImageUrl;


  return {

    leafletBounds:
      leafletBounds,

    imageUrl:
      imageUrl,

    meta:
      meta
  };
}


/* --------------------------------------------------
   آمار
-------------------------------------------------- */

function updateStats(meta){

  var s =
    meta.statistics ||
    meta.stats ||
    {};


  if(
    typeof s.min === "number" &&
    isFinite(s.min)
  ){

    setStat(
      "st-min",
      s.min.toFixed(2)
    );

  }else{

    setStat(
      "st-min",
      "—"
    );
  }


  if(
    typeof s.max === "number" &&
    isFinite(s.max)
  ){

    setStat(
      "st-max",
      s.max.toFixed(2)
    );

  }else{

    setStat(
      "st-max",
      "—"
    );
  }


  if(
    typeof s.mean === "number" &&
    isFinite(s.mean)
  ){

    setStat(
      "st-mean",
      s.mean.toFixed(2)
    );

  }else{

    setStat(
      "st-mean",
      "—"
    );
  }


  var gridSize =
    meta.master_grid &&
    meta.master_grid.width &&
    meta.master_grid.height

      ? (
          meta.master_grid.width +
          " × " +
          meta.master_grid.height
        )

      : null;


  if(gridSize){

    setStat(
      "st-grid",
      gridSize
    );

  }else{

    setStat(
      "st-grid",
      "—"
    );
  }


  setStat(
    "st-source",
    "ECMWF / GWIS"
  );


  setStat(
    "st-date",
    meta.date ||
    meta.forecast_date ||
    "—"
  );
}


/* --------------------------------------------------
   بررسی واقعی PNG
-------------------------------------------------- */

function loadRiskImage(
  imageUrl,
  leafletBounds
){

  return new Promise(
    function(resolve, reject){

      var testImage =
        new Image();


      testImage.onload =
        function(){

          resolve();

        };


      testImage.onerror =
        function(){

          reject(
            new Error(
              "فایل نقشه ریسک پیدا نشد: " +
              imageUrl
            )
          );

        };


      /*
         جلوگیری از cache قدیمی
      */

      testImage.src =
        imageUrl +
        (
          imageUrl.indexOf("?") >= 0
            ? "&"
            : "?"
        ) +
        "v=" +
        Date.now();

    }
  );
}


/* --------------------------------------------------
   بارگذاری اصلی
-------------------------------------------------- */

function loadAll(){

  setStatus(
    "در حال دریافت فراداده پیش‌بینی…",
    "info"
  );

  hideError();


  fetch(
    CONFIG.metadataUrl,
    {
      cache:"no-store"
    }
  )

  .then(
    function(res){

      if(!res.ok){

        throw new Error(
          "دریافت فراداده ناموفق بود. " +
          "کد وضعیت: " +
          res.status
        );

      }

      return res.json();
    }
  )

  .then(
    function(meta){

      var validated =
        validateMetadata(meta);


      updateStats(meta);


      setStatus(
        "در حال بررسی تصویر ریسک…",
        "info"
      );


      return loadRiskImage(
        validated.imageUrl,
        validated.leafletBounds
      )

      .then(
        function(){

          return {
            meta:meta,
            validated:validated
          };

        }
      );
    }
  )

  .then(
    function(data){

      var meta =
        data.meta;

      var validated =
        data.validated;


      setStatus(
        "در حال بارگذاری مرز استان فارس…",
        "info"
      );


      return fetch(
        CONFIG.boundaryUrl,
        {
          cache:"no-store"
        }
      )

      .then(
        function(res){

          if(!res.ok){

            throw new Error(
              "دریافت مرز استان ناموفق بود. " +
              "کد وضعیت: " +
              res.status
            );

          }

          return res.json();
        }
      )

      .then(
        function(geo){

          /*
             رستر ریسک
          */

          riskOverlay =
            L.imageOverlay(
              validated.imageUrl,
              validated.leafletBounds,
              {
                opacity:0.85,
                interactive:false
              }
            ).addTo(map);


          /*
             مرز استان
          */

          farsLayer =
            L.geoJSON(
              geo,
              {
                style:function(){

                  return {

                    color:"#7f1d1d",

                    weight:2.5,

                    opacity:0.95,

                    fillColor:"#000000",

                    fillOpacity:0.0,

                    interactive:false

                  };

                }
              }
            ).addTo(map);


          /*
             مرز روی رستر
          */

          farsLayer.bringToFront();


          /*
             زوم روی فارس
          */

          map.fitBounds(
            farsLayer.getBounds(),
            {
              padding:[24,24]
            }
          );


          /*
             موفق
          */

          setStatus(
            "بارگذاری با موفقیت انجام شد. نقشه ریسک آتش‌سوزی استان فارس آماده است.",
            "ok"
          );

        }
      );
    }
  )

  .catch(
    function(err){

      showError(
        err &&
        err.message
          ? err.message
          : String(err)
      );

    }
  );
}


/* --------------------------------------------------
   شروع
-------------------------------------------------- */

if(
  typeof L === "undefined"
){

  showError(
    "کتابخانه Leaflet بارگذاری نشد."
  );

}else{

  loadAll();

}

</script>

</body>
</html>

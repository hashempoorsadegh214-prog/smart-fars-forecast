
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پیش‌بینی ریسک آتش‌سوزی استان فارس</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""/>

<style>

  :root{
    --bg:#0f172a;
    --panel:#1e293b;
    --panel2:#273449;
    --text:#e2e8f0;
    --muted:#94a3b8;
    --accent:#f59e0b;
    --danger:#ef4444;
    --ok:#22c55e;
    --border:#334155;
  }

  *{
    box-sizing:border-box;
    margin:0;
    padding:0;
  }

  html,
  body{
    width:100%;
    height:100%;
  }

  body{
    font-family:
      "Vazirmatn",
      "Segoe UI",
      Tahoma,
      sans-serif;

    background:var(--bg);
    color:var(--text);

    height:100vh;

    display:flex;
    flex-direction:column;

    overflow:hidden;
  }

  header{
    background:var(--panel);

    border-bottom:
      1px solid var(--border);

    padding:
      12px
      20px;

    display:flex;
    align-items:center;

    gap:12px;

    flex-shrink:0;
  }

  header h1{
    font-size:1.05rem;
    font-weight:700;
  }

  header .dot{
    width:10px;
    height:10px;

    border-radius:50%;

    background:var(--accent);

    flex-shrink:0;
  }

  #layout{
    display:flex;

    flex:1;

    min-height:0;
    min-width:0;
  }

  #map{
    flex:1;

    min-width:0;
    min-height:0;

    background:#0b1220;
  }

  #sidebar{
    width:330px;

    background:var(--panel);

    border-left:
      1px solid var(--border);

    padding:16px;

    overflow-y:auto;

    flex-shrink:0;

    display:flex;
    flex-direction:column;

    gap:14px;
  }

  .card{
    background:var(--panel2);

    border:
      1px solid var(--border);

    border-radius:10px;

    padding:14px;
  }

  .card h2{
    font-size:.9rem;

    color:var(--accent);

    margin-bottom:10px;
  }

  .stat-row{
    display:flex;

    justify-content:space-between;

    padding:5px 0;

    font-size:.85rem;

    border-bottom:
      1px dashed
      rgba(255,255,255,.07);
  }

  .stat-row:last-child{
    border-bottom:none;
  }

  .stat-row .k{
    color:var(--muted);
  }

  .stat-row .v{
    font-weight:600;
    direction:ltr;
    text-align:left;
  }

  #status{
    font-size:.85rem;

    padding:
      10px
      12px;

    border-radius:8px;

    line-height:1.7;
  }

  #status.info{
    background:
      rgba(59,130,246,.15);

    border:
      1px solid
      rgba(59,130,246,.4);

    color:#93c5fd;
  }

  #status.ok{
    background:
      rgba(34,197,94,.12);

    border:
      1px solid
      rgba(34,197,94,.4);

    color:#86efac;
  }

  #status.error{
    background:
      rgba(239,68,68,.12);

    border:
      1px solid
      rgba(239,68,68,.45);

    color:#fca5a5;
  }

  #error-panel{
    border-color:
      rgba(239,68,68,.5);
  }

  #error-text{
    font-size:.85rem;
    line-height:1.9;
    word-break:break-word;
  }

  #legend-bar{
    display:flex;

    height:14px;

    border-radius:4px;

    overflow:hidden;

    margin:
      8px
      0
      4px;
  }

  #legend-bar div{
    flex:1;
  }

  #legend-labels{
    display:flex;

    justify-content:space-between;

    font-size:.7rem;

    color:var(--muted);

    direction:ltr;
  }

  .hidden{
    display:none !important;
  }

  footer{
    font-size:.7rem;

    color:var(--muted);

    text-align:center;

    margin-top:auto;
  }

  @media (max-width:760px){

    #layout{
      flex-direction:column;
    }

    #map{
      min-height:55vh;
      height:55vh;
    }

    #sidebar{
      width:100%;

      max-height:45vh;

      border-left:none;

      border-top:
        1px solid
        var(--border);

      order:2;
    }

  }

</style>

</head>

<body>

<header>

  <span class="dot"></span>

  <h1>
    پیش‌بینی ریسک آتش‌سوزی استان فارس
    — smart-fars-forecast
  </h1>

</header>


<div id="layout">

  <div
    id="map"
    role="application"
    aria-label="نقشه ریسک آتش‌سوزی استان فارس">
  </div>


  <aside id="sidebar">

    <div
      id="status"
      class="info">
      در حال بارگذاری داده‌ها…
    </div>


    <div
      id="error-panel"
      class="card hidden">

      <h2>خطا</h2>

      <p id="error-text"></p>

    </div>


    <div class="card">

      <h2>
        آمار ریسک آتش‌سوزی
      </h2>


      <div class="stat-row">
        <span class="k">حداقل</span>
        <span class="v" id="st-min">—</span>
      </div>


      <div class="stat-row">
        <span class="k">حداکثر</span>
        <span class="v" id="st-max">—</span>
      </div>


      <div class="stat-row">
        <span class="k">میانگین</span>
        <span class="v" id="st-mean">—</span>
      </div>


      <div class="stat-row">
        <span class="k">ابعاد شبکه</span>
        <span class="v" id="st-grid">—</span>
      </div>


      <div class="stat-row">
        <span class="k">منبع داده</span>
        <span class="v" id="st-source">—</span>
      </div>


      <div class="stat-row">
        <span class="k">تاریخ داده</span>
        <span class="v" id="st-date">—</span>
      </div>

    </div>


    <div class="card">

      <h2>
        راهنمای ریسک
      </h2>


      <div id="legend-bar">

        <div
          style="background:#fff59d">
        </div>

        <div
          style="background:#fdd835">
        </div>

        <div
          style="background:#fb8c00">
        </div>

        <div
          style="background:#e53935">
        </div>

        <div
          style="background:#880e4f">
        </div>

      </div>


      <div id="legend-labels">

        <span>0</span>
        <span>20</span>
        <span>40</span>
        <span>60</span>
        <span>80</span>
        <span>100</span>

      </div>


      <p
        style="
          font-size:.75rem;
          color:var(--muted);
          margin-top:6px;
        ">
        ریسک کمتر → ریسک بیشتر
      </p>

    </div>


    <footer>
      ECMWF / GWIS · Leaflet · EPSG:4326
    </footer>

  </aside>

</div>


<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin="">
</script>


<script>

"use strict";


/* =========================================================
   CONFIG
========================================================= */

var CONFIG = {

  /*
     فایل متادیتای تولیدشده توسط build_forecast.py
  */
  metadataUrl:
    "generated/fire_risk_latest.json",


  /*
     مرز استان فارس
  */
  boundaryUrl:
    "fars.geojson",


  /*
     مسیر واقعی PNG تولیدشده توسط Workflow
  */
  fallbackImageUrl:
    "generated/fire_risk_latest.png",


  /*
     OpenStreetMap
  */
  tileUrl:
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",


  tileAttr:
    "&copy; OpenStreetMap contributors",


  /*
     نمای اولیه
  */
  defaultCenter:
    [29.0, 53.5],


  defaultZoom:
    7
};


/* =========================================================
   DOM
========================================================= */

var statusEl =
  document.getElementById("status");


var errorPanel =
  document.getElementById("error-panel");


var errorText =
  document.getElementById("error-text");


/* =========================================================
   STATUS
========================================================= */

function setStatus(
  message,
  type
){

  statusEl.textContent =
    message;

  if(
    type === "ok" ||
    type === "error"
  ){

    statusEl.className =
      type;

  }else{

    statusEl.className =
      "info";
  }
}


function showError(
  message
){

  errorPanel.classList.remove(
    "hidden"
  );

  errorText.textContent =
    message;

  setStatus(
    "خطا در بارگذاری — " +
    message,
    "error"
  );
}


function hideError(){

  errorPanel.classList.add(
    "hidden"
  );
}


/* =========================================================
   STAT
========================================================= */

function setStat(
  id,
  value
){

  var element =
    document.getElementById(
      id
    );

  if(element){

    element.textContent =
      value;
  }
}


/* =========================================================
   MAP
========================================================= */

var map =
  L.map(
    "map",
    {
      zoomControl:true
    }
  );


map.setView(
  CONFIG.defaultCenter,
  CONFIG.defaultZoom
);


L.tileLayer(
  CONFIG.tileUrl,
  {
    attribution:
      CONFIG.tileAttr,

    maxZoom:
      19
  }
).addTo(
  map
);


var farsLayer =
  null;


var riskOverlay =
  null;


/* =========================================================
   CACHE BUSTER
========================================================= */

function addCacheBuster(
  url
){

  return (
    url
    +
    (
      url.indexOf("?") >= 0
        ? "&"
        : "?"
    )
    +
    "v="
    +
    Date.now()
  );
}


/* =========================================================
   METADATA VALIDATION
========================================================= */

function validateMetadata(
  meta
){

  if(
    !meta ||
    typeof meta !== "object"
  ){

    throw new Error(
      "فایل fire_risk_latest.json معتبر نیست."
    );
  }


  if(
    !meta.web ||
    typeof meta.web !== "object"
  ){

    throw new Error(
      "بخش web در fire_risk_latest.json وجود ندارد."
    );
  }


  var crs =
    String(
      meta.web.crs ||
      ""
    )
    .trim()
    .toUpperCase();


  if(
    crs !== "EPSG:4326"
  ){

    throw new Error(
      "CRS وب باید EPSG:4326 باشد. " +
      "مقدار فعلی: " +
      crs
    );
  }


  var bounds =
    meta.web.bounds;


  if(
    !Array.isArray(bounds) ||
    bounds.length !== 4
  ){

    throw new Error(
      "web.bounds باید چهار مقدار داشته باشد."
    );
  }


  for(
    var i = 0;
    i < 4;
    i++
  ){

    if(
      typeof bounds[i] !== "number" ||
      !isFinite(bounds[i])
    ){

      throw new Error(
        "web.bounds دارای مقدار نامعتبر است."
      );
    }
  }


  var west =
    bounds[0];


  var south =
    bounds[1];


  var east =
    bounds[2];


  var north =
    bounds[3];


  if(
    !(west < east) ||
    !(south < north)
  ){

    throw new Error(
      "ترتیب مختصات bounds نامعتبر است."
    );
  }


  /*
     کنترل محدوده تقریبی استان فارس
  */

  if(
    west < 49 ||
    east > 59 ||
    south < 25 ||
    north > 33
  ){

    throw new Error(
      "bounds خارج از محدوده مورد انتظار استان فارس است."
    );
  }


  /*
     تبدیل:
     [west,south,east,north]

     به Leaflet:

     [[south,west],[north,east]]
  */

  var leafletBounds = [

    [
      south,
      west
    ],

    [
      north,
      east
    ]

  ];


  /*
     مسیر تصویر

     اول:
       web.image_url

     دوم:
       image_url

     سوم:
       مسیر قطعی فعلی
  */

  var imageUrl =

    meta.web.image_url ||

    meta.image_url ||

    CONFIG.fallbackImageUrl;


  /*
     اگر accidentally فقط نام فایل
     نوشته شده باشد، مسیر generated
     را اصلاح می‌کنیم.
  */

  if(
    imageUrl === "fire_risk_latest.png"
  ){

    imageUrl =
      "generated/fire_risk_latest.png";
  }


  if(
    imageUrl === "fire_risk_gradient.png"
  ){

    imageUrl =
      "generated/fire_risk_latest.png";
  }


  return {

    leafletBounds:
      leafletBounds,

    imageUrl:
      imageUrl,

    meta:
      meta

  };
}


/* =========================================================
   STATISTICS
========================================================= */

function updateStats(
  meta
){

  var statistics =
    meta.statistics ||
    meta.stats ||
    {};


  /*
     Min
  */

  if(
    typeof statistics.min === "number" &&
    isFinite(statistics.min)
  ){

    setStat(
      "st-min",
      statistics.min.toFixed(2)
    );

  }else{

    setStat(
      "st-min",
      "—"
    );
  }


  /*
     Max
  */

  if(
    typeof statistics.max === "number" &&
    isFinite(statistics.max)
  ){

    setStat(
      "st-max",
      statistics.max.toFixed(2)
    );

  }else{

    setStat(
      "st-max",
      "—"
    );
  }


  /*
     Mean
  */

  if(
    typeof statistics.mean === "number" &&
    isFinite(statistics.mean)
  ){

    setStat(
      "st-mean",
      statistics.mean.toFixed(2)
    );

  }else{

    setStat(
      "st-mean",
      "—"
    );
  }


  /*
     Grid
  */

  if(
    meta.master_grid &&
    meta.master_grid.width &&
    meta.master_grid.height
  ){

    setStat(
      "st-grid",

      String(
        meta.master_grid.width
      )
      +
      " × "
      +
      String(
        meta.master_grid.height
      )

    );

  }else{

    setStat(
      "st-grid",
      "—"
    );
  }


  /*
     Source
  */

  var source =
    "ECMWF / GWIS";


  if(
    meta.source
  ){

    source =
      meta.source.ecmwf ||
      meta.source.gwis ||
      meta.source.dataset ||
      source;
  }


  setStat(
    "st-source",
    source
  );


  /*
     Date
  */

  var date =
    meta.date ||
    meta.forecast_date ||
    (
      meta.fwi_processing &&
      meta.fwi_processing.date
    ) ||
    "—";


  setStat(
    "st-date",
    date
  );
}


/* =========================================================
   TEST IMAGE
========================================================= */

function testImage(
  imageUrl
){

  return new Promise(
    function(
      resolve,
      reject
    ){

      var image =
        new Image();


      image.onload =
        function(){

          resolve();
        };


      image.onerror =
        function(){

          reject(
            new Error(
              "فایل تصویر ریسک قابل دسترسی نیست: " +
              imageUrl
            )
          );
        };


      image.src =
        addCacheBuster(
          imageUrl
        );
    }
  );
}


/* =========================================================
   LOAD METADATA
========================================================= */

function loadMetadata(){

  return fetch(
    addCacheBuster(
      CONFIG.metadataUrl
    ),
    {
      cache:"no-store"
    }
  )

  .then(
    function(response){

      if(
        !response.ok
      ){

        throw new Error(
          "دریافت fire_risk_latest.json ناموفق بود. " +
          "HTTP " +
          response.status
        );
      }

      return response.json();
    }
  );
}


/* =========================================================
   LOAD BOUNDARY
========================================================= */

function loadBoundary(){

  return fetch(
    addCacheBuster(
      CONFIG.boundaryUrl
    ),
    {
      cache:"no-store"
    }
  )

  .then(
    function(response){

      if(
        !response.ok
      ){

        throw new Error(
          "دریافت fars.geojson ناموفق بود. " +
          "HTTP " +
          response.status
        );
      }

      return response.json();
    }
  );
}


/* =========================================================
   ADD RISK IMAGE
========================================================= */

function addRiskLayer(
  imageUrl,
  bounds
){

  if(
    riskOverlay
  ){

    map.removeLayer(
      riskOverlay
    );

    riskOverlay =
      null;
  }


  /*
     Cache bust فقط برای
     آدرس درخواست‌شده در مرورگر
  */

  var finalUrl =
    addCacheBuster(
      imageUrl
    );


  riskOverlay =
    L.imageOverlay(
      finalUrl,
      bounds,
      {
        opacity:0.90,

        interactive:false,

        crossOrigin:false,

        className:
          "fars-risk-overlay"
      }
    );


  riskOverlay.addTo(
    map
  );


  return riskOverlay;
}


/* =========================================================
   ADD FARS BOUNDARY
========================================================= */

function addBoundary(
  geo
){

  if(
    farsLayer
  ){

    map.removeLayer(
      farsLayer
    );

    farsLayer =
      null;
  }


  farsLayer =
    L.geoJSON(
      geo,
      {

        style:function(){

          return {

            color:
              "#7f1d1d",

            weight:
              2.5,

            opacity:
              0.95,

            fillColor:
              "#000000",

            fillOpacity:
              0.0,

            interactive:
              false

          };
        }

      }
    );


  farsLayer.addTo(
    map
  );


  farsLayer.bringToFront();


  return farsLayer;
}


/* =========================================================
   MAIN LOADER
========================================================= */

function loadAll(){

  hideError();


  setStatus(
    "در حال دریافت اطلاعات پیش‌بینی…",
    "info"
  );


  /*
     1. Metadata
  */

  loadMetadata()

  .then(
    function(meta){

      var validated =
        validateMetadata(
          meta
        );


      updateStats(
        meta
      );


      setStatus(
        "اطلاعات دریافت شد؛ در حال بررسی تصویر نقشه…",
        "info"
      );


      /*
         2. بررسی وجود واقعی PNG
      */

      return testImage(
        validated.imageUrl
      )

      .then(
        function(){

          return {

            meta:
              meta,

            validated:
              validated

          };
        }
      );
    }
  )


  /*
     3. Boundary
  */

  .then(
    function(data){

      setStatus(
        "تصویر ریسک موجود است؛ در حال بارگذاری مرز استان…",
        "info"
      );


      return loadBoundary()

      .then(
        function(geo){

          return {

            meta:
              data.meta,

            validated:
              data.validated,

            geo:
              geo

          };
        }
      );
    }
  )


  /*
     4. Draw map
  */

  .then(
    function(data){

      /*
         رستر
      */

      addRiskLayer(
        data.validated.imageUrl,
        data.validated.leafletBounds
      );


      /*
         مرز
      */

      var layer =
        addBoundary(
          data.geo
        );


      /*
         Fit map
      */

      var bounds =
        layer.getBounds();


      if(
        bounds &&
        bounds.isValid()
      ){

        map.fitBounds(
          bounds,
          {
            padding:
              [24,24]
          }
        );
      }


      /*
         Leaflet ممکن است
         قبل از رسم کامل map
         اندازه را اشتباه بگیرد.
      */

      setTimeout(
        function(){

          map.invalidateSize();

        },
        250
      );


      setStatus(
        "نقشه ریسک آتش‌سوزی استان فارس با موفقیت بارگذاری شد.",
        "ok"
      );

    }
  )


  /*
     5. Error
  */

  .catch(
    function(error){

      console.error(
        "Smart Fars Forecast error:",
        error
      );


      showError(
        error &&
        error.message
          ? error.message
          : String(error)
      );

    }
  );
}


/* =========================================================
   START
========================================================= */

if(
  typeof L === "undefined"
){

  showError(
    "Leaflet بارگذاری نشده است. اتصال اینترنت یا CDN را بررسی کنید."
  );

}else{

  loadAll();

}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  function(){

    setTimeout(
      function(){

        map.invalidateSize();

      },
      100
    );

  }
);

</script>

</body>
</html>
